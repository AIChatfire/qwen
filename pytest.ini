[pytest]
testpaths = tests
python_files = test_*.py
# 让 `import app` / `import tests.*` 生效：不依赖安装成包，也不依赖 CD
pythonpath = .
# 固定 basetemp：沙箱里 mkdir shim 会拦 pytest 的默认临时目录（jimeng/hailuo 同款处理）
addopts = -q --strict-markers --basetemp=/tmp/qwen-pytest
filterwarnings =
    error::DeprecationWarning:app.*
